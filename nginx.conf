server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # hashed build files never change
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  # art and audio: cache for a week
  location ~* \.(webp|mp3|woff2)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
  # single-page app: /wedding/id-4 etc. fall back to index.html, which is never cached
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
